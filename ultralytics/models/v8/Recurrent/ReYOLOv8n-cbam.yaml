# Parameters
nc: 80  # number of classes
depth_multiple: 0.5  # scales module repeats
width_multiple: 0.25  # scales convolution channels
act: nn.SiLU()

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, CBAM, [128]] # 3
  - [-1, 1, Conv_LSTM, [128]] # 4
  - [-1, 1, Conv, [256, 3, 2]]  # 5-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, CBAM, [256]] # 7
  - [-1, 1, Conv_LSTM, [256]] # 8-P3/8
  - [-1, 1, Conv, [512, 3, 2]]  # 9-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, CBAM, [512]] # 11
  - [-1, 1, Conv_LSTM, [512]] # 12-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]  # 13-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, CBAM, [1024]] # 15
  - [-1, 1, Conv_LSTM, [1024]] # 16
  - [-1, 1, SPPF, [1024, 5]]  # 17


head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 12], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 20

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 8], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]  # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]  # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [1024]]  # 29 (P5/32-large)

  - [[23, 26, 29], 1, Detect, [nc]]  # Detect(P3, P4, P5)
